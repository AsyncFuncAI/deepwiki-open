apiVersion: v1
kind: Pod
metadata:
  name: {{ include "deepwiki-open.fullname" . }}-test-health
  labels:
    {{- include "deepwiki-open.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: health
      image: {{ .Values.tests.image }}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      command:
        - sh
        - -c
        - |
          set -e
          wget -qO- http://{{ include "deepwiki-open.fullname" . }}:{{ .Values.service.ports.api }}/health
          wget -qO- http://{{ include "deepwiki-open.fullname" . }}:{{ .Values.service.ports.http }}/api/auth/status
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 32Mi
