apiVersion: v1
kind: Service
metadata:
  name: {{ include "deepwiki-open.fullname" . }}
  labels:
    {{- include "deepwiki-open.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "deepwiki-open.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.ports.http }}
      targetPort: http
      protocol: TCP
    - name: api
      port: {{ .Values.service.ports.api }}
      targetPort: api
      protocol: TCP
