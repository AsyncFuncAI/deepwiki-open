services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      # Required: no fallback. A fixed, publicly-known default credential
      # here would protect nothing once the port below is reachable.
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD:?Set LITELLM_DB_PASSWORD to a strong, unique password before starting this profile}
    ports:
      # Bound to loopback only: this port is for an operator inspecting the
      # DB locally, not for the litellm/deepwiki containers (which reach it
      # over the compose network) or for the public internet.
      - "127.0.0.1:5432:5432"
    volumes:
      - deepwiki_litellm_db:/var/lib/postgresql/data

  litellm:
    image: ghcr.io/berriai/litellm:v1.83.10-stable
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./litellm-config.yml:/app/config.yaml
    environment:
      # Required: no fallback. A fixed, publicly-known default master key
      # here would protect nothing once the port below is reachable.
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY to a strong, unique secret before starting this profile}
      - DATABASE_URL=postgres://litellm:${LITELLM_DB_PASSWORD:?Set LITELLM_DB_PASSWORD to a strong, unique password before starting this profile}@db:5432/litellm
    command: [ "--config", "/app/config.yaml", "--port", "4000" ]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db

  deepwiki:
    image: deepwiki-litellm  # Using image name to show it depends on LiteLLM
    build:
      context: .
      dockerfile: Dockerfile-litellm  # ← Using Dockerfile that depends on LiteLLM
    ports:
      - "${PORT:-8001}:${PORT:-8001}"  # API port
      - "3000:3000"  # Next.js port
    env_file:
      - docker-compose-litellm.env
    environment:
      - PORT=${PORT:-8001}
      - NODE_ENV=production
      - SERVER_BASE_URL=http://localhost:${PORT:-8001}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FILE_PATH=${LOG_FILE_PATH:-api/logs/application.log}
    volumes:
      - ~/.adalflow:/root/.adalflow      # Persist repository and embedding data
      - ./api/logs:/app/api/logs          # Persist log files across container restarts
      # LiteLLM-specific config overrides
      - ./api/config/generator.litellm.json:/app/api/config/generator.json:ro
      - ./api/config/embedder.litellm.json:/app/api/config/embedder.json:ro
    # Resource limits for docker-compose up (not Swarm mode)
    mem_limit: 6g
    mem_reservation: 2g
    # Health check configuration
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-8001}/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      - litellm

volumes:
  deepwiki_litellm_db:
